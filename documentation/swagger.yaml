openapi: 3.1.0
info:
  title: ical-relay
  description: |-
    Swagger/OpenAPI documentation for api.go endpoints of ical-relay.
  contact:
    email: mail@julian-lemmerich.de
  license:
    name: GNU GENERAL PUBLIC LICENSE
    url: https://www.gnu.org/licenses/gpl-3.0.html
  version: 2.0.0-beta
externalDocs:
  description: Find out more about ical-relay
  url: https://www.github.com/jm-lemmi/ical-relay

tags:
  - name: public
    description: Endpoints accessible without admin privileges
  - name: admin
    description: Endpoints requiring authorized tokens or super tokens

paths:
  /api/calendars:
    get:
      tags:
        - public
      summary: Lists calendar profiles
      description: Returns public profiles or all profiles if the provided token is a super token.
      operationId: listCalendars
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                examples:
                  - "publicProfile1"
                  - "publicProfile2"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/profiles/{profile}:
    post:
      tags:
        - admin
      summary: Create a new profile
      description: Creates a new calendar profile; requires super token.
      operationId: createProfile
      parameters:
        - name: profile
          in: path
          description: Name of the profile to create
          required: true
          schema:
            type: string
        - name: request
          in: query
          description: Profile configuration
          required: true
          schema:
            type: object
            properties:
              sources:
                type: array
                items:
                  type: string
              public:
                type: boolean
              immutable_past:
                type: boolean
      security:
        - superAuth: []
      responses:
        '200':
          description: Profile created
        '400':
          description: Error parsing request body
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '409':
          description: Profile already exists
    put:
      tags:
        - admin
      summary: Update an existing profile
      description: Edits a profile’s sources or flags; requires super token.
      operationId: updateProfile
      parameters:
        - name: profile
          in: path
          description: Name of the profile to update
          required: true
          schema:
            type: string
        - name: request
          in: query
          description: Updated profile information
          required: true
          schema:
            type: object
            properties:
              sources:
                type: array
                items:
                  type: string
              public:
                type: boolean
              immutable_past:
                type: boolean
      security:
        - superAuth: []
      responses:
        '200':
          description: Profile updated
        '400':
          description: Error parsing request body or profile does not exist
        '401':
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags:
        - admin
      summary: Delete a profile
      description: Removes a profile from the datastore; requires super token.
      operationId: deleteProfile
      parameters:
        - name: profile
          in: path
          description: Name of the profile to delete
          required: true
          schema:
            type: string
      security:
        - superAuth: []
      responses:
        '200':
          description: Profile deleted
        '400':
          description: Profile does not exist
        '401':
          $ref: "#/components/responses/UnauthorizedError"

  /api/notifier/{notifier}/recipient:
    post:
      tags:
        - public
      summary: Add a recipient to a notifier
      description: Creates a notifier if missing, then adds the recipient.
      operationId: addNotifierRecipient
      parameters:
        - name: notifier
          in: path
          description: Notifier name
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Recipient type (mail or webhook)
          required: true
          schema:
            type: string
        - name: recipient
          in: query
          description: Recipient address
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid mail address
        '403':
          description: Access denied (invalid recipient type)
        '404':
          description: Notifier or Profile does not exist
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - public
      summary: Remove a recipient from a notifier
      description: Deletes the given recipient from the notifier.
      operationId: removeNotifierRecipient
      parameters:
        - name: notifier
          in: path
          description: Notifier name
          required: true
          schema:
            type: string
        - name: recipient
          in: query
          description: Recipient address to remove
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recipient removed
        '400':
          description: Invalid mail address
        '404':
          description: Notifier does not exist
        '500':
          $ref: '#/components/responses/InternalError'

  /api/profiles/{profile}/calentry:
    get:
      tags:
        - public
      summary: Get a specific calendar entry
      description: Currently unimplemented in code. Potentially for future use.
      operationId: getCalendarEntry
      parameters:
        - name: profile
          in: path
          description: Name of the profile to query
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: ID of entry to retrieve
          required: false
          schema:
            type: string
      responses:
        '501':
          description: Not implemented
    post:
      tags:
        - admin
      summary: Edit (overwrite) a calendar entry
      description: Overwrites summary, location, start, end, or description via rules.
      operationId: editCalendarEntry
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: ID of entry to edit
          required: true
          schema:
            type: string
      requestBody:
        description: Key-value pairs to overwrite
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalEntry"
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Successfully added edit rule
        '400':
          description: Invalid request body
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found
    put:
      tags:
        - admin
      summary: (Placeholder) Add a new calendar entry
      description: Not yet implemented in code.
      operationId: putCalendarEntry
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      responses:
        '501':
          description: Not implemented
    delete:
      tags:
        - admin
      summary: Delete a calendar entry
      description: Adds a delete rule for the given entry ID.
      operationId: deleteCalendarEntry
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: ID of the entry to delete
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Rule added to delete the specified entry
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found

  /api/profiles/{profile}/newentryjson:
    post:
      tags:
        - admin
      summary: Add a new calendar entry via JSON
      description: Creates a new ICS event from JSON and appends it as base64 to the profile.
      operationId: addNewCalendarEntryJson
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      requestBody:
        description: Calendar Entry
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalEntry"
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid request body
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found

  /api/profiles/{profile}/newentryfile:
    post:
      tags:
        - admin
      summary: Upload an ICS file
      description: Validates and adds the ICS file as a base64 source.
      operationId: postNewEntryFile
      consumes:
        - multipart/form-data
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '200':
          description: File successfully validated and stored
        '400':
          description: Bad request or parse error
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found
        '422':
          description: File not a valid ICS
    put:
      tags:
        - admin
      summary: Upload an ICS file (PUT variant)
      description: Same as POST, but using PUT.
      operationId: putNewEntryFile
      consumes:
        - multipart/form-data
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '200':
          description: File successfully validated and stored
        '400':
          description: Bad request or parse error
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found
        '422':
          description: File not a valid ICS

  /api/profiles/{profile}/rules:
    get:
      tags:
        - admin
      summary: Get all rules for a profile
      description: Currently not implemented in code.
      operationId: getRules
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '501':
          description: Not implemented
    post:
      tags:
        - admin
      summary: Add a rule to a profile
      description: Creates a new rule that modifies or deletes calendar entries.
      operationId: addRule
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      requestBody:
        description: Rule configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rule"
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Successfully created rule
        '400':
          description: Invalid rule definition
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found
    delete:
      tags:
        - admin
      summary: Remove a rule from a profile
      description: Removes an existing rule by its ID.
      operationId: deleteRule
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
        - name: id
          in: query
          description: Rule ID to delete
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Rule deleted
        '400':
          description: ID missing or invalid
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found

  /api/profiles/{profile}/checkAuth:
    get:
      tags:
        - admin
      summary: Checks token authorization
      description: Verifies that a token has access to the specified profile.
      operationId: checkAuth
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      security:
        - tokenAuth: []
      responses:
        '200':
          description: Authorization successful
        '401':
          $ref: "#/components/responses/UnauthorizedError"
        '404':
          description: Profile not found

  /api/checkSuperAuth:
    get:
      tags:
        - admin
      summary: Checks super token authorization
      description: Verifies if the token provided is a super token.
      operationId: checkSuperAuth
      security:
        - superAuth: []
      responses:
        '200':
          description: Authorized
        '401':
          $ref: "#/components/responses/UnauthorizedError"

  /api/profiles/{profile}/tokens:
    get:
      tags:
        - admin
      summary: Get profile tokens
      description: Retrieves all tokens associated with a given profile.
      operationId: getTokens
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      security:
        - superAuth: []
      responses:
        '200':
          description: Successfully retrieved tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    token:
                      type: string
                    note:
                      type: string
                example:
                  - token: "abcd1234"
                    note: "Main token"
                  - token: "test5678"
                    note: "Backup"
        '403':
          description: Forbidden, not a super token
        '404':
          description: Profile not found
    put:
      tags:
        - admin
      summary: Create a new token
      description: Creates a new token for a profile; optional note can be attached.
      operationId: createToken
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      requestBody:
        description: Optional Note for Token
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      security:
        - superAuth: []
      responses:
        '200':
          description: Token created
        '400':
          description: Invalid input
        '403':
          description: Forbidden, not a super token
        '404':
          description: Profile not found
    patch:
      tags:
        - admin
      summary: Modify a token’s note
      description: Allows changing the note attached to an existing token.
      operationId: modifyToken
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      requestBody:
        description: Token Identifier and new note
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                note:
                  type: string
      security:
        - superAuth: []
      responses:
        '200':
          description: Token updated
        '400':
          description: Invalid input
        '403':
          description: Forbidden, not a super token
        '404':
          description: Profile or token not found
    delete:
      tags:
        - admin
      summary: Delete a token
      description: Removes a token from the specified profile.
      operationId: deleteToken
      parameters:
        - name: profile
          in: path
          description: Profile name
          required: true
          schema:
            type: string
      requestBody:
        description: Token to remove
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      security:
        - superAuth: []
      responses:
        '200':
          description: Token deleted
        '403':
          description: Forbidden, not a super token
        '404':
          description: Profile or token not found

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token Authentication for specific profiles
    superAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Super Token with full privileges

  responses:
    UnauthorizedError:
      description: Token is missing or invalid
      headers:
        Authorization:
          schema:
            type: string
            description: Token to use for authentication
    InternalError:
      description: Server error
      content:
        text/plain:
          schema:
            type: string
            description: Error message

  schemas:
    Rule:
      type: object
      properties:
        Filters:
          type: array
          items:
            type: object
            example:
              type: "id"
              id: "someID"
        Action:
          type: object
          example:
            type: "edit"
            overwrite: "true"
            new-summary: "Updated summary"
    CalEntry:
      type: object
      properties:
        id:
          type: string
        summary:
          type: string
        description:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        location:
          type: string
      example:
        id: "1234567890@calendar.local"
        summary: "Test"
        description: "Test"
        start: "2020-01-01T00:00:00+01:00"
        end: "2020-01-01T01:00:00+01:00"
        location: "Test"
